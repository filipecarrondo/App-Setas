<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Gestor de Setas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">◎</div>
    <div><h1 id="brandTitle">TORNEIO DE SETAS</h1><p>TORNEIO DE SETAS · LIVE SCOREBOARD · BY CARRONDO</p></div>
  </header>
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main>
      <div class="top-nav-row">
        <nav class="tabs">
          <button id="groupsTab">FASE DE GRUPOS</button>
          <button id="knockoutTab">KO DIRETO</button>
          <button id="doubleKoTab">DOUBLE KO</button>
          <button id="drawTab">JOGADORES / SORTEIO</button>
        </nav>
        <button id="adminTab" class="admin-nav">⚙ &nbsp; ADMIN</button>
      </div>
      <section id="content"></section>
    </main>
  </div>
  <div id="playerModalBackdrop" class="modal-backdrop hidden">
    <form id="playerForm" class="modal player-modal">
      <div class="modal-head">
        <div><span class="eyebrow">JOGADOR</span><h2 id="playerModalTitle">Adicionar jogador</h2></div>
        <button type="button" id="closePlayerModal" class="icon-button">×</button>
      </div>
      <label class="form-field"><span>NOME</span><input id="playerNameInput" class="text-input" maxlength="60" autocomplete="off" required></label>
      <label id="playerGroupField" class="form-field"><span id="playerGroupLabel">INSERIR NO GRUPO</span><select id="playerGroupSelect" class="text-input"></select></label>
      <p id="playerModalError" class="error"></p>
      <div class="modal-actions">
        <button type="button" id="cancelPlayerModal" class="secondary">CANCELAR</button>
        <button type="submit" class="primary">GUARDAR</button>
      </div>
    </form>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <form id="scoreForm" class="modal">
      <div class="modal-head">
        <div><span class="eyebrow">REGISTAR RESULTADO</span><h2 id="modalTitle">Resultado</h2></div>
        <button type="button" id="closeModal" class="icon-button">×</button>
      </div>
      <div class="score-grid">
        <label><span id="playerALabel">Jogador A</span><div class="score-input-wrap"><input id="scoreA" type="number" min="0" max="99" required><div class="score-stepper"><button type="button" data-score-step="scoreA" data-delta="1" aria-label="Aumentar resultado">▲</button><button type="button" data-score-step="scoreA" data-delta="-1" aria-label="Diminuir resultado">▼</button></div></div></label>
        <b>—</b>
        <label><span id="playerBLabel">Jogador B</span><div class="score-input-wrap"><input id="scoreB" type="number" min="0" max="99" required><div class="score-stepper"><button type="button" data-score-step="scoreB" data-delta="1" aria-label="Aumentar resultado">▲</button><button type="button" data-score-step="scoreB" data-delta="-1" aria-label="Diminuir resultado">▼</button></div></div></label>
      </div>
      <p id="modalError" class="error"></p>
      <div class="modal-actions">
        <button type="button" id="clearScore" class="secondary">LIMPAR RESULTADO</button>
        <button type="submit" class="primary">GUARDAR</button>
      </div>
    </form>
  </div>
  <div id="tieBreakModalBackdrop" class="modal-backdrop hidden">
    <form id="tieBreakForm" class="modal tie-break-modal">
      <div class="modal-head">
        <div><span class="eyebrow">DESEMPATE COLETIVO</span><h2 id="tieBreakModalTitle">Grupo</h2></div>
        <button type="button" id="closeTieBreakModal" class="icon-button">×</button>
      </div>
      <p id="tieBreakModalText" class="tie-modal-text">Ordene os jogadores pela posição final.</p>
      <div id="tieBreakOrder" class="tie-order-list"></div>
      <div class="modal-actions tie-modal-actions">
        <button type="button" id="resetTieBreak" class="secondary danger-soft">REPOR</button>
        <button type="button" id="cancelTieBreakModal" class="secondary">CANCELAR</button>
        <button type="submit" class="primary">GUARDAR ORDEM</button>
      </div>
    </form>
  </div>
  <div id="adminPasswordBackdrop" class="modal-backdrop hidden">
    <form id="adminPasswordForm" class="modal admin-password-modal">
      <div class="modal-head">
        <div><span class="eyebrow">ÁREA PROTEGIDA</span><h2>Autenticação de administrador</h2></div>
        <button type="button" id="closeAdminPassword" class="icon-button">×</button>
      </div>
      <label class="form-field"><span>PALAVRA-PASSE</span><input id="adminPasswordInput" class="text-input" type="password" autocomplete="current-password" required></label>
      <p id="adminPasswordError" class="error"></p>
      <div class="modal-actions">
        <button type="button" id="cancelAdminPassword" class="secondary">CANCELAR</button>
        <button type="submit" class="primary">ENTRAR</button>
      </div>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
